services:
  redis:
    image: redis:alpine
  api:
    build: . #use the Dockerfile in the current directory
    command: uvicorn app:app --host 0.0.0.0 --port 8000 #overwrite command in Dockerfile
    depends_on:
      - redis
    ports:
      - "8000:8000"
  worker:
    build: . #use the Dockerfile in the current directory
    command: rq worker --url redis://redis:6379 # service "redis" does work here because of the network created by docker-compose
    depends_on:
      - redis